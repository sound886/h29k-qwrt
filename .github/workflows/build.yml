name: Build H29K QWRT

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  TARGET: rockchip_armv8
  REPO_URL: https://github.com/openwrt/openwrt

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Clone Kwrt
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch 25.12 \
            https://github.com/kiddin9/Kwrt.git \
            kwrt

      - name: Install build dependencies
        run: |
          set -e

          sudo -E apt-get -qq update

          sudo -E apt-get -qq install \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            dwarves \
            llvm \
            python3-pyelftools \
            libpython3-dev \
            aria2 \
            jq \
            qemu-utils \
            ccache \
            rename \
            libelf-dev \
            device-tree-compiler \
            libgmp3-dev \
            libmpc-dev \
            libfuse-dev

          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git config --global user.name \
            "github-actions[bot]"

      - name: Clone OpenWrt
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git \
            openwrt

          echo "===== OpenWrt revision ====="

          cd openwrt

          git log -1 --oneline

          cd ..

          test -f openwrt/Makefile
          test -f openwrt/include/toplevel.mk
          test -d openwrt/target/linux

          echo "OpenWrt source OK"

      - name: Load Kwrt files
        run: |
          set -e

          mkdir -p openwrt

          cp -rf kwrt/devices/common/. \
            openwrt/

          cp -rf kwrt/devices/${TARGET}/. \
            openwrt/

          cp -rf kwrt/devices \
            openwrt/

      - name: Prepare Kwrt build
        working-directory: openwrt
        run: |
          set -e

          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT

            branch="$1"
            rurl="$2"
            mv="$3"

            [[ "$mv" != "mv" ]] && shift 2 || shift 3

            rootdir="$PWD"
            tmpdir="$(mktemp -d)"

            if [ ${#branch} -lt 10 ]; then
              git clone \
                -b "$branch" \
                --depth 1 \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"

              cd "$tmpdir"
            else
              git clone \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"

              cd "$tmpdir"

              git checkout "$branch"
            fi

            git sparse-checkout init --cone

            git sparse-checkout set "$@"

            if [[ "$mv" != "mv" ]]; then
              cp -rn ./* "$rootdir/"
            else
              mkdir -p "$rootdir/$@"
              mv -n "$@/"* "$rootdir/$@/"
            fi

            cd "$rootdir"
          }

          export -f git_clone_path

          export REPO_TOKEN=""

          chmod +x devices/common/diy.sh

          echo "===== Run common diy.sh ====="

          /bin/bash devices/common/diy.sh

          echo "===== Load Rockchip config ====="

          cp -f \
            devices/rockchip_armv8/.config \
            .config

          echo "===== Run Rockchip diy.sh ====="

          chmod +x devices/rockchip_armv8/diy.sh

          /bin/bash devices/rockchip_armv8/diy.sh

          echo "===== Check Rockchip source ====="

          test -f target/linux/rockchip/Makefile

          test -f target/linux/rockchip/image/armv8.mk

          echo "Rockchip source OK"

      - name: Select H29K
        working-directory: openwrt
        run: |
          set -e

          cat >> .config <<'EOF'

          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc_h29k=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          EOF

          echo "===== H29K configuration ====="

          grep -E \
            'CONFIG_TARGET_rockchip|CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc_h29k|CONFIG_PACKAGE_ttyd|CONFIG_PACKAGE_luci-app-ttyd' \
            .config || true

      - name: Add custom files
        working-directory: openwrt
        run: |
          set -e

          if [ -d ../files ]; then
            cp -a ../files/. .
          fi

      - name: Apply Kwrt patches
        working-directory: openwrt
        run: |
          set -e

          cp -rn \
            devices/common/patches \
            devices/rockchip_armv8/ 2>/dev/null || true

          if [ -d devices/rockchip_armv8/patches ]; then

            if [ -n "$(ls -A devices/rockchip_armv8/patches/*.bin.patch 2>/dev/null)" ]; then
              git apply \
                devices/rockchip_armv8/patches/*.bin.patch
            fi

            find \
              devices/rockchip_armv8/patches \
              -maxdepth 1 \
              -type f \
              -name '*.revert.patch' \
              -print0 |
            sort -z |
            xargs -0 -r -n 1 \
              sh -c \
              'patch -d ./ \
              -R \
              --no-backup-if-mismatch \
              -p1 \
              -F 1 \
              -i "$1"' _

            find \
              devices/rockchip_armv8/patches \
              -maxdepth 1 \
              -type f \
              -name '*.patch' \
              ! -name '*.revert.patch' \
              ! -name '*.bin.patch' \
              -print0 |
            sort -z |
            xargs -0 -r -n 1 \
              sh -c \
              'patch -d ./ \
              --no-backup-if-mismatch \
              -p1 \
              -F 1 \
              -i "$1"' _
          fi

      - name: Defconfig
        working-directory: openwrt
        run: |
          set -e

          make defconfig

          echo "===== TARGET ====="

          grep -E \
            'CONFIG_TARGET_rockchip|CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc_h29k' \
            .config || true

          echo "===== TTYD ====="

          grep -E \
            'CONFIG_PACKAGE_ttyd|CONFIG_PACKAGE_luci-app-ttyd' \
            .config || true

      - name: Verify H29K target
        working-directory: openwrt
        run: |
          set -e

          grep -q \
            'CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_hinlink_opc_h29k=y' \
            .config

          echo "H29K target selected successfully"

      - name: Download
        working-directory: openwrt
        run: |
          set -e

          make download -j8

      - name: Compile
        working-directory: openwrt
        run: |
          set -e

          echo "===== Start H29K compile ====="

          make -j$(($(nproc)+1))

      - name: Show firmware
        if: success()
        run: |
          echo "===== BUILD RESULT ====="

          find \
            openwrt/bin/targets \
            -type f \
            -print

          echo "===== H29K FILES ====="

          find \
            openwrt/bin/targets \
            -type f \
            -iname '*h29k*' \
            -print

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: H29K-QWRT
          path: openwrt/bin/targets/
          if-no-files-found: error
