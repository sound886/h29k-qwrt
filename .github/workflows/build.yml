name: Build H29K QWRT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            dwarves \
            llvm \
            python3-pyelftools \
            libpython3-dev \
            aria2 \
            jq \
            qemu-utils \
            ccache \
            rename \
            libelf-dev \
            device-tree-compiler \
            libgmp3-dev \
            libmpc-dev \
            libfuse-dev

      - name: Clone Kwrt build files
        run: |
          git clone --depth=1 --branch 25.12 \
            https://github.com/kiddin9/Kwrt.git \
            kwrt

      - name: Clone OpenWrt source
        run: |
          git clone --depth=1 --branch v25.12.5 \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Prepare Kwrt
        run: |
          set -e

          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT

            branch="$1"
            rurl="$2"
            mv="$3"

            [[ "$mv" != "mv" ]] && shift 2 || shift 3

            rootdir="$PWD"
            tmpdir="$(mktemp -d)"

            if [ ${#branch} -lt 10 ]; then
              git clone \
                -b "$branch" \
                --depth 1 \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"
            else
              git clone \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"

              cd "$tmpdir"
              git checkout "$branch"
            fi

            cd "$tmpdir"

            git sparse-checkout init --cone
            git sparse-checkout set "$@"

            if [[ "$mv" != "mv" ]]; then
              cp -rn ./* "$rootdir/"
            else
              mkdir -p "$rootdir/$@"
              mv -n "$@/"* "$rootdir/$@/"
            fi

            cd "$rootdir"
          }

          export -f git_clone_path

          mkdir -p openwrt/devices

          cp -rf kwrt/devices/common openwrt/devices/
          cp -rf kwrt/devices/rockchip_armv8 openwrt/devices/

          cd openwrt

          chmod +x devices/common/diy.sh
          chmod +x devices/rockchip_armv8/diy.sh

          export REPO_TOKEN=""

          /bin/bash devices/common/diy.sh
          /bin/bash devices/rockchip_armv8/diy.sh

      - name: Apply H29K configuration
        working-directory: openwrt
        run: |
          set -e

          cat ../config/h29k.config >> .config

      - name: Add QModem
        working-directory: openwrt
        run: |
          set -e

          echo "src-git qmodem https://github.com/FUjr/QModem.git;main" >> feeds.conf.default

          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem

      - name: Add custom files
        working-directory: openwrt
        run: |
          set -e

          if [ -d ../files ]; then
            cp -a ../files/. .
          fi

      - name: Defconfig
        working-directory: openwrt
        run: |
          set -e

          make defconfig

          echo "===== H29K CONFIG ====="
          grep -E \
            'TARGET_rockchip|hinlink_opc-h29k|qmodem|ttyd|rndis|usb-net' \
            .config || true

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8

      - name: Compile
        working-directory: openwrt
        run: |
          set -e

          make -j$(nproc) || {
            make V=s -j1
          }

      - name: Show firmware
        run: |
          echo "===== BUILD RESULT ====="
          find openwrt/bin/targets -type f -print

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: H29K-QWRT
          path: openwrt/bin/targets/
          if-no-files-found: error
