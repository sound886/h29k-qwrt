name: Build H29K QWRT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            dwarves \
            llvm \
            python3-pyelftools \
            libpython3-dev \
            aria2 \
            jq \
            qemu-utils \
            ccache \
            rename \
            libelf-dev \
            device-tree-compiler \
            libgmp3-dev \
            libmpc-dev \
            libfuse-dev

      - name: Clone Kwrt
        run: |
          git clone --depth=1 --branch 25.12 \
            https://github.com/kiddin9/Kwrt.git \
            openwrt

      - name: Prepare Kwrt
        working-directory: openwrt
        run: |
          chmod +x devices/common/diy.sh
          chmod +x devices/rockchip_armv8/diy.sh

          export REPO_TOKEN=""
          export TARGET="rockchip_armv8"

          /bin/bash devices/common/diy.sh

          /bin/bash devices/rockchip_armv8/diy.sh

      - name: Add H29K configuration
        working-directory: openwrt
        run: |
          cat ../config/h29k.config >> .config

      - name: Add custom files
        working-directory: openwrt
        run: |
          if [ -d ../files ]; then
            cp -a ../files/. .
          fi

      - name: Install modem feed
        working-directory: openwrt
        run: |
          if ! grep -q "FUjr/QModem" feeds.conf.default; then
            echo "src-git qmodem https://github.com/FUjr/QModem.git;main" >> feeds.conf.default
          fi

          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem

      - name: Configure
        working-directory: openwrt
        run: |
          make defconfig

          echo
          echo "===== H29K CONFIG ====="
          grep -E \
            'TARGET_rockchip|luci-app-qmodem|qmodem|ttyd|usb-net|rndis|kmod-usb' \
            .config || true

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8 || true

      - name: Compile
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s

      - name: Show firmware
        run: |
          echo "===== BUILD RESULT ====="
          find openwrt/bin/targets -type f \
            \( -name "*h29k*" -o -name "*opc-h29k*" -o -name "*.img.gz" \) \
            -print

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: H29K-QWRT
          path: openwrt/bin/targets/
          if-no-files-found: error
