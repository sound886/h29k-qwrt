name: Build H29K QWRT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            dwarves \
            llvm \
            python3-pyelftools \
            libpython3-dev \
            aria2 \
            jq \
            qemu-utils \
            ccache \
            rename \
            libelf-dev \
            device-tree-compiler \
            libgmp3-dev \
            libmpc-dev \
            libfuse-dev

      - name: Clone Kwrt
        run: |
          git clone --depth=1 \
            --branch 25.12 \
            https://github.com/kiddin9/Kwrt.git \
            kwrt

      - name: Prepare build environment
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          mkdir -p openwrt/devices

          cp -a kwrt/devices/common openwrt/devices/
          cp -a kwrt/devices/rockchip_armv8 openwrt/devices/

          echo "===== DEVICE FILES ====="
          find openwrt/devices -maxdepth 2 -type f -print

      - name: Run Kwrt common build script
        working-directory: openwrt
        run: |
          set -e

          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT

            branch="$1"
            rurl="$2"
            mv="$3"

            [[ "$mv" != "mv" ]] && shift 2 || shift 3

            rootdir="$PWD"
            tmpdir="$(mktemp -d)"

            if [ ${#branch} -lt 10 ]; then
              git clone \
                -b "$branch" \
                --depth 1 \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"
            else
              git clone \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"

              cd "$tmpdir"
              git checkout "$branch"
            fi

            cd "$tmpdir"

            git sparse-checkout init --cone
            git sparse-checkout set "$@"

            if [[ "$mv" != "mv" ]]; then
              cp -rn ./* "$rootdir/"
            else
              mkdir -p "$rootdir/$@"
              mv -n "$@/"* "$rootdir/$@/"
            fi

            cd "$rootdir"
          }

          export -f git_clone_path
          export REPO_TOKEN=""

          chmod +x devices/common/diy.sh

          ./devices/common/diy.sh

      - name: Run Rockchip build script
        working-directory: openwrt
        run: |
          set -e

          chmod +x devices/rockchip_armv8/diy.sh

          ./devices/rockchip_armv8/diy.sh

      - name: Apply H29K configuration
        working-directory: openwrt
        run: |
          set -e

          cat ../config/h29k.config >> .config

      - name: Add QModem
        working-directory: openwrt
        run: |
          set -e

          echo "src-git qmodem https://github.com/FUjr/QModem.git;main" \
            >> feeds.conf.default

          ./scripts/feeds update qmodem
          ./scripts/feeds install -a -p qmodem

      - name: Add custom files
        working-directory: openwrt
        run: |
          set -e

          cp -a ../files/. .

      - name: Configure
        working-directory: openwrt
        run: |
          set -e

          make defconfig

          echo "===== TARGET ====="
          grep -E \
            'CONFIG_TARGET_rockchip|CONFIG_TARGET_DEVICE' \
            .config || true

          echo "===== MODEM ====="
          grep -E \
            'qmodem|ttyd|usb-net|rndis|usb-serial' \
            .config || true

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8

      - name: Compile
        working-directory: openwrt
        run: |
          set -e

          make -j$(nproc)

      - name: Compile again with verbose output if failed
        if: failure()
        working-directory: openwrt
        run: |
          make V=s -j1

      - name: Show firmware
        if: success()
        run: |
          echo "===== BUILD RESULT ====="
          find openwrt/bin/targets -type f -print

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: H29K-QWRT
          path: openwrt/bin/targets/
          if-no-files-found: error
