name: Build H29K QWRT

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  TARGET: rockchip_armv8

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Clone Kwrt
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch 25.12 \
            https://github.com/kiddin9/Kwrt.git \
            kwrt

      - name: Install dependencies
        run: |
          sudo -E apt-get -qq update

          sudo -E apt-get -qq install \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            dwarves \
            llvm \
            python3-pyelftools \
            libpython3-dev \
            aria2 \
            jq \
            qemu-utils \
            ccache \
            rename \
            libelf-dev \
            device-tree-compiler \
            libgmp3-dev \
            libmpc-dev \
            libfuse-dev

      - name: Clone OpenWrt
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git \
            openwrt

          test -f openwrt/Makefile
          test -f openwrt/include/toplevel.mk
          test -d openwrt/target/linux

          echo "OpenWrt source OK"

      - name: Load Kwrt configuration
        run: |
          set -e

          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT

            branch="$1"
            rurl="$2"
            mv="$3"

            [[ "$mv" != "mv" ]] && shift 2 || shift 3

            rootdir="$PWD"
            tmpdir="$(mktemp -d)"

            if [ ${#branch} -lt 10 ]; then
              git clone \
                -b "$branch" \
                --depth 1 \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"

              cd "$tmpdir"
            else
              git clone \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"

              cd "$tmpdir"
              git checkout "$branch"
            fi

            git sparse-checkout init --cone
            git sparse-checkout set "$@"

            if [[ "$mv" != "mv" ]]; then
              rsync -a \
                --exclude='.git/' \
                ./ \
                "$rootdir/"
            else
              mkdir -p "$rootdir/$@"
              mv -n "$@/"* "$rootdir/$@/"
            fi

            cd "$rootdir"
          }

          export -f git_clone_path

          mkdir -p openwrt/devices

          cp -rf kwrt/devices/common/. openwrt/
          cp -rf kwrt/devices/${TARGET}/. openwrt/
          cp -rf kwrt/devices openwrt/

          cd openwrt

          export REPO_TOKEN=""

          chmod +x devices/common/diy.sh
          chmod +x devices/${TARGET}/diy.sh

          echo "===== Run common diy.sh ====="

          /bin/bash devices/common/diy.sh

          echo "===== Load common config ====="

          if [ -f devices/common/.config ]; then
            cp -f devices/common/.config .config
          fi

          echo "===== Load Rockchip config ====="

          if [ -f devices/${TARGET}/.config ]; then
            echo >> .config
            cat devices/${TARGET}/.config >> .config
          fi

          echo "===== Run Rockchip diy.sh ====="

          /bin/bash devices/${TARGET}/diy.sh

          echo "===== Check Rockchip source ====="

          test -f target/linux/rockchip/Makefile
          test -f target/linux/rockchip/image/armv8.mk

          echo "Rockchip source OK"

          cd ..

      - name: Apply H29K configuration
        working-directory: openwrt
        run: |
          set -e

          if [ -f ../config/h29k.config ]; then
            echo "===== Apply H29K config ====="
            cat ../config/h29k.config >> .config
          fi

      - name: Enable TTYD
        working-directory: openwrt
        run: |
          set -e

          echo "CONFIG_PACKAGE_ttyd=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-ttyd=y" >> .config

      - name: Add custom files
        working-directory: openwrt
        run: |
          set -e

          if [ -d ../files ]; then
            cp -a ../files/. .
          fi

      - name: Apply Kwrt patches
        working-directory: openwrt
        run: |
          set -e

          if [ -d devices/common/patches ]; then
            cp -rn \
              devices/common/patches \
              devices/${TARGET}/
          fi

          if [ -d devices/${TARGET}/patches ]; then

            find devices/${TARGET}/patches \
              -maxdepth 1 \
              -type f \
              -name '*.bin.patch' \
              -print0 |
            xargs -0 -r -n 1 git apply

            find devices/${TARGET}/patches \
              -maxdepth 1 \
              -type f \
              -name '*.revert.patch' \
              -print0 |
            sort -z |
            xargs -0 -r -n 1 \
              sh -c \
              'patch -d ./ \
              -R \
              --no-backup-if-mismatch \
              -p1 \
              -F 1 \
              -i "$1"' _

            find devices/${TARGET}/patches \
              -maxdepth 1 \
              -type f \
              -name '*.patch' \
              ! -name '*.revert.patch' \
              ! -name '*.bin.patch' \
              -print0 |
            sort -z |
            xargs -0 -r -n 1 \
              sh -c \
              'patch -d ./ \
              --no-backup-if-mismatch \
              -p1 \
              -F 1 \
              -i "$1"' _
          fi

      - name: Defconfig
        working-directory: openwrt
        run: |
          set -e

          make defconfig

          echo "===== TARGET ====="

          grep -E \
            'CONFIG_TARGET_rockchip|CONFIG_TARGET_DEVICE' \
            .config || true

          echo "===== TTYD ====="

          grep -E \
            'CONFIG_PACKAGE_ttyd|CONFIG_PACKAGE_luci-app-ttyd' \
            .config || true

      - name: Download
        working-directory: openwrt
        run: |
          set -e

          make download -j8

      - name: Compile
        working-directory: openwrt
        run: |
          set -e

          make -j$(($(nproc)+1)) || {
            echo "===== VERBOSE BUILD ====="
            make V=s -j1
          }

      - name: Show firmware
        if: success()
        run: |
          echo "===== BUILD RESULT ====="

          find openwrt/bin/targets \
            -type f \
            -print

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: H29K-QWRT
          path: openwrt/bin/targets/
          if-no-files-found: error
