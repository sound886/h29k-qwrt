name: Build H29K QWRT

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Clone Kwrt
        run: |
          git clone --depth=1 --branch 25.12 \
            https://github.com/kiddin9/Kwrt.git \
            kwrt

      - name: Prepare build environment
        run: |
          set -e

          echo "===== Clone OpenWrt ====="

          git clone \
            --depth=1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git \
            openwrt

          echo "===== Check OpenWrt ====="

          test -f openwrt/Makefile
          test -f openwrt/include/toplevel.mk
          test -d openwrt/target/linux

          echo "===== OpenWrt source OK ====="

          cd openwrt
          git log -1 --oneline
          git describe --tags --always || true
          cd ..

      - name: Load Kwrt configuration
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          mkdir -p openwrt/devices

          cp -rf kwrt/devices/common/. \
            openwrt/

          cp -rf kwrt/devices/rockchip_armv8/. \
            openwrt/

          cp -rf kwrt/devices \
            openwrt/

          cd openwrt

          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT

            branch="$1"
            rurl="$2"
            mv="$3"

            [[ "$mv" != "mv" ]] && shift 2 || shift 3

            rootdir="$PWD"
            tmpdir="$(mktemp -d)"

            if [ ${#branch} -lt 10 ]; then
              git clone \
                -b "$branch" \
                --depth 1 \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"

              cd "$tmpdir"
            else
              git clone \
                --filter=blob:none \
                --sparse \
                "$rurl" \
                "$tmpdir"

              cd "$tmpdir"
              git checkout "$branch"
            fi

            git sparse-checkout init --cone
            git sparse-checkout set "$@"

            if [[ "$mv" != "mv" ]]; then
              cp -rn ./* "$rootdir/"
            else
              mkdir -p "$rootdir/$@"
              mv -n "$@/"* "$rootdir/$@/"
            fi

            cd "$rootdir"
          }

          export -f git_clone_path

          export REPO_TOKEN=""

          chmod +x devices/common/diy.sh
          chmod +x devices/rockchip_armv8/diy.sh

          echo "===== Run common diy.sh ====="

          /bin/bash devices/common/diy.sh

          echo "===== Load Rockchip config ====="

          cp -f devices/rockchip_armv8/.config .config

          echo "===== Run Rockchip diy.sh ====="

          /bin/bash devices/rockchip_armv8/diy.sh
      - name: Run Rockchip diy.sh
        working-directory: openwrt
        run: |
          set -e

          chmod +x devices/rockchip_armv8/diy.sh

          echo "===== Run Rockchip diy.sh ====="

          /bin/bash devices/rockchip_armv8/diy.sh

      - name: Enable H29K packages
        working-directory: openwrt
        run: |
          set -e

          echo "CONFIG_PACKAGE_ttyd=y" >> .config

      - name: Add custom files
        working-directory: openwrt
        run: |
          set -e

          if [ -d ../files ]; then
            cp -a ../files/. .
          fi


      - name: Defconfig
        working-directory: openwrt
        run: |
          set -e

          make defconfig

          echo "===== TARGET ====="

          grep -E \
            'CONFIG_TARGET_rockchip|CONFIG_TARGET_DEVICE' \
            .config || true

          echo "===== MODEM / TTYD ====="

          grep -E \
            'CONFIG_PACKAGE_ttyd|usb-net|rndis|usb-serial|qmi|mbim' \
            .config || true

      - name: Download
        working-directory: openwrt
        run: |
          make download -j8

      - name: Compile
        working-directory: openwrt
        run: |
          set -e

          make -j$(($(nproc)+1)) || {
            make V=s -j1
          }

      - name: Show firmware
        if: success()
        run: |
          echo "===== BUILD RESULT ====="
          find openwrt/bin/targets -type f -print

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@main
        with:
          name: H29K-QWRT
          path: openwrt/bin/targets/
