name: Build H29K QWRT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show System Information
        run: |
          echo "===== System ====="
          uname -a
          echo
          echo "===== CPU ====="
          lscpu
          echo
          echo "===== Memory ====="
          free -h
          echo
          echo "===== Disk ====="
          df -h

      - name: Test Success
        run: |
          echo "===================================="
          echo " H29K QWRT Build Environment Ready "
          echo "===================================="
